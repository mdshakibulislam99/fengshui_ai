<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Live weather intelligence dashboard with current conditions, hourly trends, and weekly forecast.">
    <title>Weather | QiMatrix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="weather-page.css?v=20260310w3">
    <script src="header.js" defer></script>
</head>
<body>
    <div class="weather-bg" aria-hidden="true"></div>

    <main class="weather-page">
        <section class="weather-hero">
            <p class="kicker">Live Atmospheric Intelligence</p>
            <h1>Weather Center</h1>
            <p class="sub">Track current conditions, hourly movement, and 7-day trend from your IP location or any city.</p>

            <form id="weatherSearchForm" class="weather-search" autocomplete="off">
                <input id="weatherQuery" type="text" placeholder="Search city or place (e.g. Hong Kong)">
                <button type="submit">Search</button>
                <button id="weatherUseDevice" type="button" class="ghost">Use Device Location</button>
                <button id="weatherUseIp" type="button" class="ghost">Use My IP</button>
            </form>

            <div class="quick-controls">
                <div class="unit-toggle" role="group" aria-label="Temperature unit">
                    <button id="unitC" type="button" class="unit-btn active">C</button>
                    <button id="unitF" type="button" class="unit-btn">F</button>
                </div>
            </div>

            <div class="status-row">
                <span id="weatherSource" class="status-chip">Source: Detecting...</span>
                <span id="weatherState" class="status-chip muted">Waiting for weather data</span>
            </div>
        </section>

        <section class="weather-grid">
            <article class="card current-card">
                <div class="current-head">
                    <span id="weatherLocalTime" class="mono">--:--</span>
                    <span id="weatherTimezone" class="mono">--</span>
                </div>
                <div class="current-main">
                    <img id="weatherIcon" alt="Weather icon" width="84" height="84">
                    <div>
                        <div id="weatherTemp" class="temp">--.-</div>
                        <div id="weatherCondition" class="condition">--</div>
                        <div id="weatherLocation" class="place">--</div>
                    </div>
                </div>
                <div class="chips" id="weatherAlerts"></div>
            </article>

            <article class="card metrics-card">
                <h2>Core Metrics</h2>
                <div class="metric-grid" id="weatherMetrics"></div>
            </article>

            <article class="card highlights-card">
                <h2>Today Highlights</h2>
                <div class="highlights-grid" id="todayHighlights"></div>
            </article>

            <article class="card astronomy-card">
                <h2>Sun & Moon</h2>
                <div class="astro-grid" id="sunMoonGrid"></div>
            </article>

            <article class="card hourly-card">
                <h2>Next 24 Hours</h2>
                <div id="hourlyStrip" class="hourly-strip"></div>
            </article>

            <article class="card daily-card">
                <h2>7 Day Forecast</h2>
                <div id="dailyList" class="daily-list"></div>
            </article>
        </section>
    </main>

    <script src="weather-page.js?v=20260310w4"></script>
</body>
</html>
